name: Build google signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: google-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-google-aab:
    runs-on: ubuntu-latest

    env:
      GRADLE_JVM_ARGS: -Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVM_ARGS: -Xmx1024m
      # Core SDK 仍托管在私有 ReMax GitHub Packages 仓库。复用现有
      # Secrets 的值，但在 Gradle 侧使用与 Launcher 解耦后的通用变量名。
      REMAX_SDK_GITHUB_USER: ${{ secrets.LAUNCHER_SDK_GITHUB_USER }}
      REMAX_SDK_GITHUB_TOKEN: ${{ secrets.LAUNCHER_SDK_GITHUB_TOKEN }}

    steps:
      - name: Verify Core SDK credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REMAX_SDK_GITHUB_USER:-}" ] || [ -z "${REMAX_SDK_GITHUB_TOKEN:-}" ]; then
            echo "Missing ReMax Core SDK credentials." >&2
            echo "Configure repository secrets LAUNCHER_SDK_GITHUB_USER and LAUNCHER_SDK_GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Chartboost Mediation 5.3.0 的 consumer ProGuard 文件错误携带 -printmapping，
          # R8 会把 mapping 写回 immutable transform。依赖与 wrapper 继续缓存，但 transform
          # 必须在每个 Job 内重新生成，避免污染后的目录被保存并恢复到下一次构建。
          gradle-home-cache-excludes: |
            caches/*/transforms
            caches/*/transforms/**

      - name: Remove restored Gradle transform workspaces
        shell: bash
        # 清理历史 Actions cache 已恢复的损坏目录；脚本带路径边界校验，不触碰依赖和 wrapper。
        run: bash scripts/clean-gradle-transform-cache.sh

      # google-services.json 不进仓库（.gitignore），每次打包从 Secret 写回；
      # 更换 Firebase 项目时只需更新 GOOGLE_SERVICES_JSON，无需改代码。
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_PATH: app/src/google/google-services.json
        run: |
          set -euo pipefail

          if [ -s "$GOOGLE_SERVICES_PATH" ]; then
            echo "Using existing $GOOGLE_SERVICES_PATH"
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            mkdir -p "$(dirname "$GOOGLE_SERVICES_PATH")"
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$GOOGLE_SERVICES_PATH"
          else
            echo "Missing $GOOGLE_SERVICES_PATH." >&2
            echo "Configure repository secret GOOGLE_SERVICES_JSON with the google flavor Firebase config." >&2
            exit 1
          fi

          PACKAGE_NAME="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["client"][0]["client_info"]["android_client_info"]["package_name"])' "$GOOGLE_SERVICES_PATH")"
          echo "google-services.json package_name: $PACKAGE_NAME"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Configure CI Gradle properties
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          {
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.daemon.performance.disable-logging=true"
          } >> "$HOME/.gradle/gradle.properties"
          echo "CI gradle.properties:"
          cat "$HOME/.gradle/gradle.properties"

      - name: Print runner diagnostics
        run: |
          set -euo pipefail
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "CPU:"
          nproc || true
          echo "Memory:"
          free -h || true
          echo "Meminfo:"
          grep -E 'MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
          echo "Disk:"
          df -h || true
          echo "Ulimit:"
          ulimit -a || true
          echo "Java:"
          java -version
          echo "Java VM settings:"
          java -XshowSettings:vm -version 2>&1 | sed -n '1,80p'
          echo "Gradle JVM args: ${GRADLE_JVM_ARGS}"
          echo "Kotlin daemon JVM args: ${KOTLIN_DAEMON_JVM_ARGS}"
          echo "R8 full mode: false"

      - name: Validate Firebase config and resolve version info
        id: version_info
        run: |
          set -euo pipefail
          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )

          VERSION_NAME="$(./gradlew -q :app:processGoogleReleaseGoogleServices \
            :app:printGoogleReleaseVersionName --console=plain "${COMMON_GRADLE_ARGS[@]}")"
          AAB_NAME="$(./gradlew -q :app:printGoogleReleaseAabName --console=plain "${COMMON_GRADLE_ARGS[@]}")"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"

      - name: Build signed googleRelease AAB
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_SIGNING_STORE_PASSWORD:-}" ] ||
             [ -z "${ANDROID_SIGNING_KEY_ALIAS:-}" ] || [ -z "${ANDROID_SIGNING_KEY_PASSWORD:-}" ]; then
            echo "Configure repository secrets ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, and ANDROID_SIGNING_KEY_PASSWORD using the existing Google Play upload key." >&2
            exit 1
          fi

          ANDROID_SIGNING_STORE_FILE="$(mktemp "${RUNNER_TEMP}/google-upload-key.XXXXXX")"
          export ANDROID_SIGNING_STORE_FILE
          trap 'rm -f -- "$ANDROID_SIGNING_STORE_FILE"' EXIT
          if ! printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE" ||
             [ ! -s "$ANDROID_SIGNING_STORE_FILE" ]; then
            echo "ANDROID_SIGNING_KEYSTORE_BASE64 must contain the Base64-encoded Google Play upload keystore." >&2
            exit 1
          fi
          unset ANDROID_SIGNING_KEYSTORE_BASE64

          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )
          BUILD_ARGS=(
            -Pandroid.release.optimizeEnabled=false
          )

          echo "Building googleRelease with minify enabled, optimize disabled, and R8 compat mode."

          ./gradlew :app:bundleGoogleRelease \
            -x lint \
            -x :app:lintGoogleRelease \
            -x :app:lintVitalGoogleRelease \
            -x :app:lintVitalAnalyzeGoogleRelease \
            -x :app:lintVitalReportGoogleRelease \
            "${BUILD_ARGS[@]}" \
            "${COMMON_GRADLE_ARGS[@]}" \
            --no-daemon \
            --stacktrace

      - name: Rename AAB output
        id: rename_aab
        run: |
          set -euo pipefail

          AAB_DIR="app/build/outputs/bundle/googleRelease"
          TARGET_AAB="$AAB_DIR/${{ steps.version_info.outputs.aab_name }}"
          SOURCE_AAB="$(find "$AAB_DIR" -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          if [ -z "$SOURCE_AAB" ]; then
            echo "No AAB file found in $AAB_DIR" >&2
            exit 1
          fi

          if [ "$SOURCE_AAB" != "$TARGET_AAB" ]; then
            rm -f "$TARGET_AAB"
            mv "$SOURCE_AAB" "$TARGET_AAB"
          fi

          echo "target_aab=$TARGET_AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.aab_name }}
          path: ${{ steps.rename_aab.outputs.target_aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove R8-polluted Gradle transform workspaces
        if: always()
        shell: bash
        # setup-gradle 的 post action 保存缓存前再次清理；构建失败时也必须执行。
        run: bash scripts/clean-gradle-transform-cache.sh
