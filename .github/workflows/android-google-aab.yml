name: Build google signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # CI 回传签名文件时不需要再触发一次打包。
    paths-ignore:
      - app/src/google/google-release.keystore
      - app/src/google/google-release-signing.properties

permissions:
  # 首次打包生成的上传密钥和签名信息需要推回 main。
  contents: write
  packages: read

concurrency:
  group: google-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-google-aab:
    runs-on: ubuntu-latest

    env:
      GRADLE_JVM_ARGS: -Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVM_ARGS: -Xmx1024m
      # Core SDK 仍托管在私有 ReMax GitHub Packages 仓库。复用现有
      # Secrets 的值，但在 Gradle 侧使用与 Launcher 解耦后的通用变量名。
      REMAX_SDK_GITHUB_USER: ${{ secrets.LAUNCHER_SDK_GITHUB_USER }}
      REMAX_SDK_GITHUB_TOKEN: ${{ secrets.LAUNCHER_SDK_GITHUB_TOKEN }}
      # Google 渠道上传密钥与签名信息（别名、密码、证书指纹）都保存在仓库中；
      # 两个文件缺失时由本流程生成并提交到 main，之后每次打包复用同一把密钥。
      KEYSTORE_REPO_PATH: app/src/google/google-release.keystore
      SIGNING_PROPERTIES_PATH: app/src/google/google-release-signing.properties
      NEW_KEY_ALIAS: musicplayerflow

    steps:
      - name: Verify Core SDK credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REMAX_SDK_GITHUB_USER:-}" ] || [ -z "${REMAX_SDK_GITHUB_TOKEN:-}" ]; then
            echo "Missing ReMax Core SDK credentials." >&2
            echo "Configure repository secrets LAUNCHER_SDK_GITHUB_USER and LAUNCHER_SDK_GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Chartboost Mediation 5.3.0 的 consumer ProGuard 文件错误携带 -printmapping，
          # R8 会把 mapping 写回 immutable transform。依赖与 wrapper 继续缓存，但 transform
          # 必须在每个 Job 内重新生成，避免污染后的目录被保存并恢复到下一次构建。
          gradle-home-cache-excludes: |
            caches/*/transforms
            caches/*/transforms/**

      - name: Remove restored Gradle transform workspaces
        shell: bash
        # 清理历史 Actions cache 已恢复的损坏目录；脚本带路径边界校验，不触碰依赖和 wrapper。
        run: bash scripts/clean-gradle-transform-cache.sh

      - name: Ensure google release keystore exists
        id: ensure_keystore
        run: |
          set -euo pipefail

          if [ -s "$KEYSTORE_REPO_PATH" ]; then
            if [ ! -s "$SIGNING_PROPERTIES_PATH" ]; then
              echo "$KEYSTORE_REPO_PATH exists but $SIGNING_PROPERTIES_PATH is missing." >&2
              echo "Restore the signing properties for this keystore, or delete the keystore to generate a new upload key." >&2
              exit 1
            fi
            echo "Using existing keystore: $KEYSTORE_REPO_PATH"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PKCS12 只有一个密码，store 与 key 使用同一个随机密码。
          PASSWORD="$(openssl rand -hex 16)"
          mkdir -p "$(dirname "$KEYSTORE_REPO_PATH")"
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_REPO_PATH" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias "$NEW_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=Music Player Flow, OU=Android, C=US"

          CERT_INFO="$(keytool -list -v -keystore "$KEYSTORE_REPO_PATH" -storepass "$PASSWORD" -alias "$NEW_KEY_ALIAS")"
          SHA1="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)"
          SHA256="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"

          cat > "$SIGNING_PROPERTIES_PATH" <<EOF
          # Google Play upload key for the google flavor.
          # Generated by GitHub Actions on $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${GITHUB_RUN_ID}).
          # Keep this file and google-release.keystore together: losing either one means a new upload key.
          # storeFile is relative to this file.
          storeFile=$(basename "$KEYSTORE_REPO_PATH")
          storePassword=$PASSWORD
          keyAlias=$NEW_KEY_ALIAS
          keyPassword=$PASSWORD
          # Certificate SHA-1:   $SHA1
          # Certificate SHA-256: $SHA256
          EOF

          echo "Generated new upload key (alias $NEW_KEY_ALIAS)."
          echo "Certificate SHA-1:   $SHA1"
          echo "Certificate SHA-256: $SHA256"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated keystore and signing info to main
        if: steps.ensure_keystore.outputs.created == 'true'
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A new upload key can only be created from main; run this workflow on main first." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$KEYSTORE_REPO_PATH" "$SIGNING_PROPERTIES_PATH"
          git commit -m "chore: add google release keystore and signing info"

          # main 在打包期间可能有新提交，推送失败时变基后重试。
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push the generated keystore to main." >&2
          exit 1

      # google-services.json 已提交到仓库；仅当仓库中缺失时才从 GOOGLE_SERVICES_JSON Secret 写入。
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_PATH: app/src/google/google-services.json
        run: |
          set -euo pipefail

          if [ -s "$GOOGLE_SERVICES_PATH" ]; then
            echo "Using existing $GOOGLE_SERVICES_PATH"
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            mkdir -p "$(dirname "$GOOGLE_SERVICES_PATH")"
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$GOOGLE_SERVICES_PATH"
          else
            echo "Missing $GOOGLE_SERVICES_PATH." >&2
            echo "Configure repository secret GOOGLE_SERVICES_JSON with the google flavor Firebase config." >&2
            exit 1
          fi

          PACKAGE_NAME="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["client"][0]["client_info"]["android_client_info"]["package_name"])' "$GOOGLE_SERVICES_PATH")"
          echo "google-services.json package_name: $PACKAGE_NAME"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Configure CI Gradle properties
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          {
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.daemon.performance.disable-logging=true"
          } >> "$HOME/.gradle/gradle.properties"
          echo "CI gradle.properties:"
          cat "$HOME/.gradle/gradle.properties"

      - name: Print runner diagnostics
        run: |
          set -euo pipefail
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "CPU:"
          nproc || true
          echo "Memory:"
          free -h || true
          echo "Meminfo:"
          grep -E 'MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
          echo "Disk:"
          df -h || true
          echo "Ulimit:"
          ulimit -a || true
          echo "Java:"
          java -version
          echo "Java VM settings:"
          java -XshowSettings:vm -version 2>&1 | sed -n '1,80p'
          echo "Gradle JVM args: ${GRADLE_JVM_ARGS}"
          echo "Kotlin daemon JVM args: ${KOTLIN_DAEMON_JVM_ARGS}"
          echo "R8 full mode: false"

      - name: Validate Firebase config and resolve version info
        id: version_info
        run: |
          set -euo pipefail
          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )

          VERSION_NAME="$(./gradlew -q :app:processGoogleReleaseGoogleServices \
            :app:printGoogleReleaseVersionName --console=plain "${COMMON_GRADLE_ARGS[@]}")"
          AAB_NAME="$(./gradlew -q :app:printGoogleReleaseAabName --console=plain "${COMMON_GRADLE_ARGS[@]}")"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"

      # 签名由 app/build.gradle.kts 读取 app/src/google/google-release-signing.properties。
      - name: Build signed googleRelease AAB
        run: |
          set -euo pipefail

          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )
          BUILD_ARGS=(
            -Pandroid.release.optimizeEnabled=false
          )

          echo "Building googleRelease with minify enabled, optimize disabled, and R8 compat mode."

          ./gradlew :app:bundleGoogleRelease \
            -x lint \
            -x :app:lintGoogleRelease \
            -x :app:lintVitalGoogleRelease \
            -x :app:lintVitalAnalyzeGoogleRelease \
            -x :app:lintVitalReportGoogleRelease \
            "${BUILD_ARGS[@]}" \
            "${COMMON_GRADLE_ARGS[@]}" \
            --no-daemon \
            --stacktrace

      - name: Rename AAB output
        id: rename_aab
        run: |
          set -euo pipefail

          AAB_DIR="app/build/outputs/bundle/googleRelease"
          TARGET_AAB="$AAB_DIR/${{ steps.version_info.outputs.aab_name }}"
          SOURCE_AAB="$(find "$AAB_DIR" -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          if [ -z "$SOURCE_AAB" ]; then
            echo "No AAB file found in $AAB_DIR" >&2
            exit 1
          fi

          if [ "$SOURCE_AAB" != "$TARGET_AAB" ]; then
            rm -f "$TARGET_AAB"
            mv "$SOURCE_AAB" "$TARGET_AAB"
          fi

          echo "target_aab=$TARGET_AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.aab_name }}
          path: ${{ steps.rename_aab.outputs.target_aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove R8-polluted Gradle transform workspaces
        if: always()
        shell: bash
        # setup-gradle 的 post action 保存缓存前再次清理；构建失败时也必须执行。
        run: bash scripts/clean-gradle-transform-cache.sh
